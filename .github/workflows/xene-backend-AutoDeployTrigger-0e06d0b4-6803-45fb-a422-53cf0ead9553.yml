name: Trigger auto deployment for xene-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/xene-backend-AutoDeployTrigger-0e06d0b4-6803-45fb-a422-53cf0ead9553.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.XENEBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.XENEBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.XENEBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: xeneacr7244.azurecr.io
          registryUsername: ${{ secrets.XENEBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.XENEBACKEND_REGISTRY_PASSWORD }}
          containerAppName: xene-backend
          resourceGroup: xene-rg
          imageToBuild: xeneacr7244.azurecr.io/xene-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



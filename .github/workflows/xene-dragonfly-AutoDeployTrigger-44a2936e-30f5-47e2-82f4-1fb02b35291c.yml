name: Trigger auto deployment for xene-dragonfly

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/xene-dragonfly-AutoDeployTrigger-44a2936e-30f5-47e2-82f4-1fb02b35291c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.XENEDRAGONFLY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.XENEDRAGONFLY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.XENEDRAGONFLY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: xeneacr7244.azurecr.io
          registryUsername: ${{ secrets.XENEDRAGONFLY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.XENEDRAGONFLY_REGISTRY_PASSWORD }}
          containerAppName: xene-dragonfly
          resourceGroup: xene-rg
          imageToBuild: xeneacr7244.azurecr.io/xene-dragonfly:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



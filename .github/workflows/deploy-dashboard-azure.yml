name: Deploy Dashboard to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'packages/xene_dashboard/**'
      - '.github/workflows/deploy-dashboard-azure.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: xene-rg
  ACR_REGISTRY_NAME: xeneacr
  CONTAINER_APP_NAME: xene-dashboard
  CONTAINER_APP_ENV: xene-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Docker image
        run: |
          cd packages/xene_dashboard
          docker build -t ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }} .
          docker tag ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }} ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:latest

      - name: Push to ACR
        run: |
          az acr login --name ${{ env.ACR_REGISTRY_NAME }}
          docker push ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }}
          docker push ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:latest

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --image ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }}

      - name: Log deployment
        run: |
          echo "Dashboard deployed to Azure Container Apps"
          echo "Image: ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }}"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"

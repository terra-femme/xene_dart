name: Deploy Dashboard to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'packages/xene_dashboard/**'
      - '.github/workflows/deploy-dashboard-azure.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: xene-rg
  ACR_REGISTRY_NAME: xeneacr7244
  CONTAINER_APP_NAME: xene-dashboard
  CONTAINER_APP_ENV: xene-env

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get ACR access token
        run: |
          TOKEN=$(az acr login --name ${{ env.ACR_REGISTRY_NAME }} --expose-token --output tsv --query accessToken)
          echo "ACR_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY_NAME }}.azurecr.io
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ env.ACR_TOKEN }}

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: ./packages/xene_dashboard
          push: true
          tags: |
            ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }}
            ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --image ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }}

      - name: Log deployment
        run: |
          echo "Dashboard deployed to Azure Container Apps"
          echo "Image: ${{ env.ACR_REGISTRY_NAME }}.azurecr.io/xene-dashboard:${{ github.sha }}"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"

name: xene_app
description: The official Xene cross-platform application.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: "^3.11.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  supabase_flutter: ^2.8.0
  app_links: ^6.3.4
  just_audio: ^0.9.38
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  logging: ^1.2.0
  xene_domain:
    path: ../xene_domain
  intl: ^0.20.2
  dart_frog: ^1.1.0
  web: ^1.1.0
  lottie: ^3.1.3
  youtube_player_flutter: ^10.0.1
  shared_preferences: ^2.3.0
  pointer_interceptor: ^0.10.1+2
  # Native SoundCloud embed hosts the SC Widget API HTML in a WebView (web keeps
  # its <iframe>). The _android/_wkwebview packages are declared directly because
  # soundcloud_embed_native.dart imports them for platform-specific autoplay/
  # inline-playback config (otherwise depend_on_referenced_packages fires).
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  shaders:
    - assets/shaders/magazine_liquid.frag
  assets:
    - assets/bandcamp-button-bc-circle-green-64.png
    - assets/soundcloud_logo.png
    - assets/yt_icon_red_digital.png
    - assets/animations/
    # Dancing Points WebGL page — bundled so the native WebView
    # (dancing_points_view_native.dart) can load it via loadFlutterAsset.
    # Flutter asset directory entries are NON-recursive, so every subfolder must
    # be listed explicitly — assets/ holds the brain texture (scene.js loads
    # assets/brain_wire_reference.png); without it the brain renders untextured.
    - web/dancing_points/
    - web/dancing_points/js/
    - web/dancing_points/assets/
